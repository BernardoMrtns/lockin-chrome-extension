<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lock In — Resumo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: radial-gradient(circle at top, #1f2937 0, #0f172a 42%, #050816 100%);
      --card: rgba(15, 23, 42, 0.8);
      --card-border: rgba(148, 163, 184, 0.16);
      --accent: linear-gradient(135deg, #60a5fa 0%, #818cf8 45%, #a78bfa 100%);
      --accent-hover: linear-gradient(135deg, #818cf8 0%, #60a5fa 100%);
      --text: #ffffff;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --shadow: 0 24px 70px rgba(2, 6, 23, 0.45);
      --glass-bg: rgba(15, 23, 42, 0.56);
      --glass-border: rgba(148, 163, 184, 0.14);
    }
    * {
      box-sizing: border-box;
    }
    html { color-scheme: dark; }
    body{
      margin: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }
    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.42;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      top: -56px;
      left: -48px;
      background: rgba(96, 165, 250, 0.28);
    }
    body::after {
      right: -56px;
      bottom: -64px;
      background: rgba(167, 139, 250, 0.28);
    }
    .wrap{ max-width: 1000px; margin: 0 auto; }
    .card{
      position: relative;
      z-index: 1;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.76));
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 22%);
      pointer-events: none;
    }
    h1{ margin: 0 0 8px 0; font-size: 24px; font-weight: 700; letter-spacing: 0.01em; }
    h2{ font-size: 18px; margin-bottom: 16px; font-weight: 600; letter-spacing: 0.01em; }
    .meta{ color: var(--text-secondary); margin-bottom: 16px; font-size: 14px; line-height: 1.5; }
    .controls{
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button{
      background: var(--accent);
      color: var(--text);
      border: 0;
      padding: 10px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 14px 28px rgba(96, 165, 250, 0.18);
    }
    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    button.secondary{
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
    }
    button.secondary:hover {
      background: rgba(255,255,255,0.08);
    }
    #chartWrap{
      height: 300px;
      margin: 18px 0;
      background: rgba(15, 23, 42, 0.58);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid var(--glass-border);
      position: relative;
    }
    canvas{
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
    }
    .chart-empty {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-style: italic;
      pointer-events: none;
      text-align: center;
      padding: 24px;
    }
    #chartWrap[data-empty="true"] .chart-empty {
      display: flex;
    }
    #chartWrap[data-empty="true"] canvas {
      visibility: hidden;
    }
    table{
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      background: rgba(15, 23, 42, 0.48);
      border-radius: 16px;
      overflow: hidden;
    }
    th, td{
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--glass-border);
    }
    th{
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td.count{
      text-align: right;
      font-weight: 600;
      color: #667eea;
      font-size: 16px;
    }
    .empty{
      color: var(--text-muted);
      padding: 40px 20px;
      text-align: center;
      font-style: italic;
    }
    .footer{
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 16px;
      border-top: 1px solid var(--glass-border);
    }
    .history{ margin-top: 32px; }
    .history .session{
      margin-bottom: 16px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.48);
      border-radius: 16px;
      border: 1px solid var(--glass-border);
    }
    .history .session h3{
      font-size: 16px;
      margin: 0 0 8px 0;
      font-weight: 500;
    }
    .history .session p{
      margin: 0 0 4px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .session-attempts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .attempt-tag {
      background: var(--accent);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    @media (max-width: 720px) {
      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
      #chartWrap {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="summaryTitle">Resumo das Tentativas de Sessão</h1>
      <div class="meta" id="metaText"></div>

      <div id="chartWrap">
        <div class="chart-empty" id="chartEmpty">Nenhuma tentativa registrada</div>
        <canvas id="barChart"></canvas>
      </div>

      <div id="tableWrap"></div>

      <div class="footer">
        <div id="totalText"></div>
        <div id="lastUpdated"></div>
      </div>
    </div>

    <div class="card history">
      <h2 id="historyTitle">Histórico de Sessões</h2>
      <div id="historyWrap"></div>
    </div>
  </div>

  <script type="module" src="summary.js"></script>
</body>
</html>
