<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lock In</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="summary.css" />
</head>
<body>
  <div class="page">
    <header class="head">
      <div class="head__top">
        <span class="wordmark">Lock In</span>
        <div class="head__tools">
          <div class="langs" id="langs"></div>
          <button class="btn btn--quiet" id="resetBtn" type="button" data-i18n="summaryReset"></button>
        </div>
      </div>
      <h1 class="head__title" data-i18n="summaryHeading"></h1>
      <p class="head__sub" id="headSub"></p>
    </header>

    <section class="stats" id="stats"></section>

    <section class="panel card">
      <div class="card__head">
        <h2 class="card__title" data-i18n="summaryWeekTitle"></h2>
        <span class="eyebrow" id="weekLegend"></span>
      </div>
      <div class="graph" id="graph"></div>
      <p class="empty" id="graphEmpty" data-i18n="summaryNoData" hidden></p>
    </section>

    <section class="panel card">
      <div class="card__head">
        <h2 class="card__title" data-i18n="summaryOffendersTitle"></h2>
        <button class="btn btn--quiet" id="clearCountersBtn" type="button" data-i18n="summaryClearCounters"></button>
      </div>
      <ul class="ranks" id="ranks"></ul>
      <p class="empty" id="ranksEmpty" data-i18n="summaryNoAttempts" hidden></p>
    </section>

    <section class="panel card">
      <div class="card__head">
        <h2 class="card__title" data-i18n="summaryHistoryTitle"></h2>
      </div>
      <ul class="sessions" id="sessions"></ul>
      <p class="empty" id="sessionsEmpty" data-i18n="summaryNoHistory" hidden></p>
    </section>

    <section class="panel card" id="supportCard">
      <div class="card__head">
        <h2 class="card__title" data-i18n="summarySupportTitle"></h2>
      </div>
      <div class="support" id="supportPanel"></div>
    </section>
  </div>

  <script type="module" src="summary.js"></script>
</body>
</html>
