<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bloqueado — Lock In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at top, #1f2937 0, #0f172a 46%, #050816 100%);
      --card: rgba(15, 23, 42, 0.8);
      --card-border: rgba(148, 163, 184, 0.16);
      --accent: linear-gradient(135deg, #60a5fa 0%, #818cf8 45%, #a78bfa 100%);
      --accent-hover: linear-gradient(135deg, #818cf8 0%, #60a5fa 100%);
      --text: #ffffff;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --shadow: 0 24px 70px rgba(2, 6, 23, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      filter: blur(28px);
      opacity: 0.42;
      pointer-events: none;
    }

    body::before {
      top: -48px;
      left: -40px;
      background: rgba(96, 165, 250, 0.32);
    }

    body::after {
      right: -56px;
      bottom: -52px;
      background: rgba(167, 139, 250, 0.3);
    }

    .card {
      position: relative;
      width: min(420px, 100%);
      padding: 40px 32px 32px;
      border-radius: 24px;
      border: 1px solid var(--card-border);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.76));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      text-align: center;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 24%);
      pointer-events: none;
    }

    .card h1 {
      margin: 0 0 14px 0;
      font-size: 2rem;
      font-weight: 700;
      background: var(--accent);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .card p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 auto 16px;
      max-width: 320px;
    }

    #siteText {
      margin: 0 auto 24px;
      padding: 10px 14px;
      width: fit-content;
      max-width: 100%;
      border-radius: 999px;
      color: var(--text);
      background: rgba(96, 165, 250, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.18);
      font-size: 0.95rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .close-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 13px 22px;
      width: 100%;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(96, 165, 250, 0.18);
      transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
      margin-top: 8px;
    }
    .close-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      filter: brightness(1.04);
      box-shadow: 0 18px 32px rgba(96, 165, 250, 0.24);
    }
    @media (max-width: 500px) {
      .card {
        padding: 30px 20px 24px;
      }
      .card h1 {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="blockedTitle">Ops — site bloqueado</h1>
    <p id="blockedDescription">Este site está bloqueado porque você está em uma sessão de foco.</p>
    <div id="siteText"></div>
    <button id="closeBtn" class="close-btn"></button>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
