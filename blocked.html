<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lock In</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <div class="stage">
    <header class="stage__bar">
      <span class="wordmark">Lock In</span>
      <span class="eyebrow" id="stateLabel"></span>
    </header>

    <main class="slab">
      <h1 class="slab__shout" id="heading"></h1>

      <p class="slab__site">
        <span class="slab__site-name" id="siteName"></span>
        <span class="slab__site-verb" id="siteVerb"></span>
      </p>

      <div class="clockline" id="clockline" hidden>
        <span class="eyebrow" id="clockLabel"></span>
        <span class="numeral clockline__value" id="clock">--:--</span>
      </div>

      <p class="slab__tally" id="tally"></p>

      <div class="slab__actions">
        <button class="btn btn--primary" id="primaryBtn" type="button"></button>
        <button class="btn" id="secondaryBtn" type="button"></button>
      </div>
    </main>

    <footer class="stage__foot">
      <span class="hint" id="footNote"></span>
    </footer>
  </div>

  <script type="module" src="blocked.js"></script>
</body>
</html>
