<!doctype html>
<!--
  Local preview harness. Not shipped (tools/ is excluded from the zip).

  Runs the real page markup and the real module against a stubbed chrome.*,
  so what you see is the production code rather than a mockup. The stub and the
  seeded scenarios live in harness.js, shared with make-shots.html.

  Serve the project root with `npm run serve` (it sends no-store, so an edited
  module is never mixed with a cached one) and open:
    tools/preview.html?page=popup&scenario=idle
    tools/preview.html?page=popup&scenario=running
    tools/preview.html?page=popup&scenario=paused
    tools/preview.html?page=blocked&scenario=first
    tools/preview.html?page=blocked&scenario=repeat
    tools/preview.html?page=blocked&scenario=over
    tools/preview.html?page=summary

  Append &locale=pt_BR or &locale=es to preview a translation.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>Lock In — preview</title>
  <style>
    html, body { margin: 0; }
    body[data-page='popup'] { width: 344px; }
  </style>
</head>
<body>
<script type="module">
import { installChromeStub, mountPage } from './harness.js';

const query = new URLSearchParams(location.search);
const page = query.get('page') || 'popup';
const scenario = query.get('scenario') || 'idle';
const locale = query.get('locale');

installChromeStub({ page, scenario, locale });

document.body.dataset.page = page;

mountPage({ page, scenario })
  .then(() => console.log(`[preview] ${page}/${scenario} booted`))
  .catch(error => {
    document.body.innerHTML =
      `<pre style="color:red;padding:16px;white-space:pre-wrap">${error.stack}</pre>`;
  });
</script>
</body>
</html>
