<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lock In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 id="appTitle">Lock In</h1>

    <section class="config">
      <label id="blockedSitesLabel"></label>
      <textarea id="sitesInput" placeholder=""></textarea>
      <label id="focusTimeLabel"></label>
      <input id="minutesInput" type="number" min="1" value="25" />
      <div class="controls">
        <button id="startBtn" aria-label=""></button>
        <button id="pauseBtn" aria-label=""></button>
        <button id="stopBtn" aria-label=""></button>
      </div>
    </section>

    <section class="status">
      <div id="statusText"></div>
      <div id="timerCircle">
        <svg id="timerSvg" viewBox="0 0 80 80">
          <circle class="circle-bg" cx="40" cy="40" r="32" />
          <circle class="circle-fg" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="201" />
          <text class="circle-text" x="40" y="44" id="circleText"></text>
        </svg>
      </div>
      <div id="timerText"></div>
      <button id="showSummary" aria-label=""></button>
      <button id="clearCounts" aria-label=""></button>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
